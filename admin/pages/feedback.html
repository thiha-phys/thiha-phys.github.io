<!doctype html>
<html lang="my">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7fb">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Customer Feedback | UTHK Admin</title>
</head>
<body>
    <main class="page-shell feedback-admin-page">
        <header class="page-top">
            <a class="back-button" href="tools.html" aria-label="Back to Workspace"><i class="fa-solid fa-arrow-left"></i></a>
            <div>
                <h1 class="page-title">Customer Feedback</h1>
                <p class="page-subtitle">Customer messages are grouped by account and shown in conversation order.</p>
            </div>
        </header>

        <div class="feedback-inbox-toolbar">
            <i class="fa-solid fa-inbox" aria-hidden="true"></i>
            <span class="feedback-admin-status" id="feedback-admin-status" role="status" aria-live="polite">Loading feedback…</span>
            <button class="feedback-refresh-button" id="feedback-refresh" type="button">
                <i class="fa-solid fa-rotate" aria-hidden="true"></i>
                <span>Refresh</span>
            </button>
        </div>

        <section class="feedback-admin-inbox" aria-label="Customer feedback conversations">
            <div id="feedback-list" class="feedback-admin-list" aria-label="Customer accounts"></div>
            <section id="feedback-conversation" class="feedback-admin-conversation" aria-label="Conversation" aria-live="polite"></section>
        </section>
    </main>
    <script src="admin-api.js"></script>
    <script src="admin-nav.js"></script>
    <script src="feedback.js"></script>
</body>
</html>
