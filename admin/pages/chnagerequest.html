<!doctype html>
<html lang="my">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Order | UTHK Admin</title>
    <link rel="icon" type="image/png" href="../logo.png"><link rel="apple-touch-icon" href="../icons/app-icon-192.png"><link rel="manifest" href="../manifest.webmanifest"><link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body><main class="page-shell">
    <header class="page-top"><a class="back-button" href="historyorder.html" aria-label="Back to Order History"><i class="fa-solid fa-arrow-left"></i></a><div><h1 class="page-title">Edit Order</h1><p class="page-subtitle">Select an order from history, or search for it here.</p></div></header>
    <section class="panel" id="lookup-panel">
        <h2>Find an Order</h2><form id="lookup-form" class="search-row"><input id="lookup-query" class="search-input" type="search" placeholder="Voucher number, name, or phone" required><button class="primary-button" type="submit"><i class="fa-solid fa-magnifying-glass"></i> Search</button></form>
        <div class="history-refresh-row"><span id="lookup-cache-status" class="muted small">Orders load from the database when searched.</span></div>
        <p id="lookup-status" class="status-message" role="status"></p><div id="lookup-results" class="result-list"></div>
    </section>
    <section id="edit-panel" class="panel" hidden>
        <h2>Edit Order Details</h2>
        <p class="search-hint" id="edit-order-hint">Review the order, payment, and delivery details, then save changes to the existing order.</p>
        <form id="edit-form"><div id="edit-tabs" class="edit-tabs" role="tablist" aria-label="Order information sections"></div><div id="edit-fields" class="edit-groups"></div>
            <div class="button-row edit-actions"><button id="save-order" class="primary-button" type="submit"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button></div>
            <p id="edit-status" class="status-message" role="status"></p>
        </form>
    </section>
</main>
<script src="admin-api.js"></script><script src="chnagerequest.js"></script><script src="admin-nav.js"></script>
</body></html>
