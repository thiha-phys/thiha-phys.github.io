<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Store Orders | UTHK Admin</title>
    <link rel="icon" type="image/png" href="../logo.png"><link rel="apple-touch-icon" href="../icons/app-icon-192.png"><link rel="manifest" href="../manifest.webmanifest"><link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body><main class="page-shell">
    <header class="page-top"><a class="back-button" href="../index.html" aria-label="Back to dashboard"><i class="fa-solid fa-arrow-left"></i></a><div><h1 class="page-title">Store Orders</h1><p class="page-subtitle">View and manage store invoices.</p></div></header>
    <section class="panel">
        <div class="history-modes store-order-modes" role="group" aria-label="Filter store orders">
            <button class="history-mode" type="button" data-mode="undelivered" aria-pressed="false"><i class="fa-solid fa-truck-fast" aria-hidden="true"></i><span>Undelivered</span></button>
            <button class="history-mode" type="button" data-mode="unpaid" aria-pressed="false"><i class="fa-solid fa-money-bill-wave" aria-hidden="true"></i><span>Unpaid</span></button>
        </div>
        <div class="history-refresh-row"><span id="undelivered-shop-status" class="muted small">Loading store orders…</span><button id="refresh-undelivered-shop-orders" class="icon-button" type="button" aria-label="Refresh store orders" title="Refresh"><i class="fa-solid fa-rotate"></i></button></div>
        <div id="undelivered-shop-order-list" class="order-list"></div>
    </section>
</main>
<script src="admin-api.js"></script><script src="undelivered-shop-orders.js"></script><script src="admin-nav.js"></script>
</body></html>
