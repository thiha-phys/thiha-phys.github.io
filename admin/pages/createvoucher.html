<!doctype html>
<html lang="my">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reprint Voucher | UTHK Admin</title>
    <link rel="icon" type="image/png" href="../logo.png"><link rel="apple-touch-icon" href="../icons/app-icon-192.png"><link rel="manifest" href="../manifest.webmanifest"><link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body><main class="page-shell">
    <header class="page-top no-print"><a class="back-button" href="historyorder.html" aria-label="Back to Order History"><i class="fa-solid fa-arrow-left"></i></a><div><h1 class="page-title">Reprint Voucher</h1><p class="page-subtitle">Open or print the selected order voucher.</p></div></header>
    <section id="voucher-search-panel" class="panel no-print">
        <form id="voucher-search-form" class="search-row"><input id="voucher-query" class="search-input" type="search" placeholder="Voucher number, name, or phone" required><button class="primary-button" type="submit"><i class="fa-solid fa-magnifying-glass"></i> Search</button></form>
        <div class="history-refresh-row"><span id="voucher-cache-status" class="muted small">Orders load from the database when searched.</span></div>
        <p id="voucher-status" class="status-message" role="status"></p><div id="voucher-results" class="result-list"></div>
    </section>
    <section id="receipt" class="receipt" hidden>
        <div class="receipt-head"><div class="receipt-heading"><p class="eyebrow">PHYSICS LEARNING HUB</p><h2>Order Voucher</h2><strong id="receipt-voucher"></strong></div><img class="receipt-logo" src="../logo.png" alt="UTHK logo"></div>
        <div id="receipt-info" class="receipt-grid"></div>
        <div class="receipt-section-heading">Books Ordered</div>
        <div id="receipt-items"></div>
        <div id="receipt-totals"></div>
        <div class="receipt-total"><span>Total Amount Due</span><strong id="receipt-total"></strong></div>
        <div class="no-print button-row">
            <button id="share-voucher" class="secondary-button" type="button"><i class="fa-solid fa-share-nodes"></i> Share</button>
            <button id="print-voucher" class="primary-button" type="button"><i class="fa-solid fa-print"></i> Print / Save PDF</button>
        </div>
        <p id="voucher-action-status" class="status-message no-print" role="status"></p>
    </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="receipt-actions.js"></script>
<script src="admin-api.js"></script><script src="createvoucher.js"></script><script src="admin-nav.js"></script>
</body></html>
