<!doctype html>
<html lang="my">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Stock | UTHK Admin</title>
    <link rel="icon" type="image/png" href="../logo.png"><link rel="apple-touch-icon" href="../icons/app-icon-192.png"><link rel="manifest" href="../manifest.webmanifest"><link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body><main class="page-shell">
    <header class="page-top"><a class="back-button" href="tools.html" aria-label="Back to Workspace"><i class="fa-solid fa-arrow-left"></i></a><div><h1 class="page-title">Book Stock</h1><p class="page-subtitle">Add stock entries and review the remaining quantity after delivered orders are deducted.</p></div></header>
    <section class="panel">
        <h2>Add New Stock</h2>
        <form id="stock-form" class="form-grid">
            <label class="field">Book<select name="bookId" id="stock-book" required></select></label>
            <label class="field">Stock Date<input name="date" type="date" required></label>
            <label class="field">Quantity<input name="quantity" type="number" min="1" step="1" inputmode="numeric" required></label>
            <div class="field"><span>&nbsp;</span><button id="add-stock" class="primary-button" type="submit"><i class="fa-solid fa-plus"></i> Add Stock</button></div>
        </form>
        <p id="stock-status" class="status-message" role="status"></p>
    </section>
    <section class="panel"><div class="section-heading"><div><h2>Stock Overview</h2><span id="stock-cache-status" class="muted small">Refresh</span></div><button id="refresh-stock" class="secondary-button" type="button"><i class="fa-solid fa-rotate"></i> Refresh from Database</button></div>
        <div id="stock-grid" class="stock-grid"></div>
    </section>
</main>
<script src="admin-api.js"></script><script src="checkstock.js"></script><script src="admin-nav.js"></script>
</body></html>
