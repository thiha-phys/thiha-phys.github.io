<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#f4f7fb">
    <title>Announcements | Admin</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <main class="page-shell announcement-admin">
        <header class="page-top">
            <a class="back-button" href="tools.html" aria-label="Back">←</a>
            <div><h1 class="page-title">Announcements</h1><p class="page-subtitle">Choose up to 3 announcements to show in the customer app.</p></div>
        </header>
        <section class="panel announcement-editor">
            <form id="announcement-form">
                <input type="hidden" name="id">
                <label class="field">Title<input name="title" maxlength="200" required></label>
                <label class="field">Message<textarea name="body" rows="4" maxlength="10000" required></textarea></label>
                <div class="announcement-form-actions">
                    <button class="primary-button" type="submit">Save</button>
                    <button class="secondary-button" id="cancel-edit" type="button" hidden>Cancel</button>
                </div>
                <p id="announcement-status" role="status"></p>
            </form>
        </section>
        <section class="panel announcement-admin-list">
            <div class="announcement-admin-heading"><h2>All announcements</h2><span id="announcement-count" class="announcement-count">0 / 3 showing</span></div>
            <div id="announcement-items" class="announcement-admin-items" aria-live="polite"></div>
        </section>
    </main>
    <script src="admin-api.js"></script>
    <script src="announcements.js"></script>
    <script src="admin-nav.js"></script>
</body>
</html>
