<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb"><link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/png" href="../logo.png"><link rel="stylesheet" href="../style.css">
  <title>Learning Content | UTHK Admin</title>
  <style>
    .content-page{max-width:980px;margin:auto;padding:20px 16px 110px}.content-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.content-head h1{margin:0}.filters,.editor{display:grid;gap:12px}.filters{grid-template-columns:repeat(3,minmax(0,1fr));padding:16px;background:#fff;border:1px solid #e1e8f2;border-radius:18px}.filters label,.editor label{display:grid;gap:6px;font-weight:650;color:#52627b}.filters select,.editor input,.editor textarea{width:100%;min-width:0;border:1px solid #ccd8e7;border-radius:12px;background:#fff;color:#1d2a40;padding:11px 12px;font:inherit}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0}.records{display:grid;gap:10px}.record{padding:14px;background:#fff;border:1px solid #e1e8f2;border-radius:16px}.record-top{display:flex;justify-content:space-between;gap:12px}.record h3{margin:0;font-size:16px}.record p{margin:5px 0 0;color:#75849b}.record-actions{display:flex;gap:8px;align-items:center}.record-actions button,.toolbar button,.form-actions button{border:0;border-radius:10px;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer}.edit-btn{background:#eaf1ff;color:#2459a8}.delete-btn{background:#fff0f0;color:#a83240}.primary{background:#2766d8;color:white}.secondary{background:#edf1f6;color:#43536a}.editor{margin-top:18px;padding:16px;background:#fff;border:1px solid #dce5f0;border-radius:18px}.editor[hidden]{display:none}.editor textarea{min-height:280px;font:13px/1.5 ui-monospace,SFMono-Regular,monospace}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{color:#63738c;min-height:22px}.form-actions{display:flex;justify-content:flex-end;gap:9px}.empty{padding:28px;text-align:center;color:#72819a;background:#fff;border-radius:16px}@media(max-width:600px){.filters{grid-template-columns:1fr}.record-top{display:block}.record-actions{margin-top:12px}.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="content-page">
  <header class="content-head"><a class="back-btn" href="tools.html" aria-label="Back to workspace">←</a><div><h1 class="page-title">Learning Content</h1><p>Manage Grade 10, 11 and 12 study materials stored in the database.</p></div></header>
  <section class="filters" aria-label="Filter learning content">
    <label>Grade<select id="grade"><option value="10">Grade 10</option><option value="11">Grade 11</option><option value="12">Grade 12</option></select></label>
    <label>Type<select id="category"><option value="objectives">Objectives</option><option value="calculations">Calculations</option><option value="definitions">Definitions</option><option value="short_questions">Short Questions</option><option value="old_questions">Old Questions</option><option value="one_mark">One Mark</option></select></label>
    <label>Chapter / set<select id="chapter"></select></label>
  </section>
  <div class="toolbar"><span id="count" class="notice">Choose a chapter to load its records.</span><button class="primary" id="add">Add content</button></div>
  <p class="notice" id="message" role="status"></p><section class="records" id="records"></section>
  <form class="editor" id="editor" hidden>
    <input type="hidden" id="record-id">
    <div class="form-grid">
      <label>Grade<input id="edit-grade" type="number" min="10" max="12" required></label>
      <label>Category<input id="edit-category" required readonly></label>
      <label>Chapter / set<input id="edit-chapter" required></label>
      <label>Title<input id="edit-title" required></label>
      <label>Sort order<input id="edit-order" type="number" step="1"></label>
      <label>Show to customers<select id="edit-active"><option value="true">Yes</option><option value="false">No</option></select></label>
    </div>
    <label>Content (JSON)<textarea id="edit-content" spellcheck="false" required></textarea></label>
    <div class="form-actions"><button class="secondary" type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save</button></div>
  </form>
</main>
<script src="admin-nav.js"></script><script src="admin-api.js"></script>
<script>
const grade=document.getElementById('grade'),category=document.getElementById('category'),chapter=document.getElementById('chapter'),records=document.getElementById('records'),message=document.getElementById('message'),editor=document.getElementById('editor');
const chapterCounts={10:{objectives:11,calculations:11,definitions:11},11:{objectives:12,calculations:12,definitions:12},12:{objectives:13,calculations:13,short_questions:13,definitions:13,old_questions:13}};
function setMessage(text,isError=false){message.textContent=text;message.style.color=isError?'#b42336':'#63738c';}
function rebuildChapters(){const count=chapterCounts[grade.value]?.[category.value]|| (category.value==='old_questions'&&grade.value==='12'?13:0);chapter.replaceChildren();const all=document.createElement('option');all.value='';all.textContent='All chapters / sets';chapter.append(all);for(let i=1;i<=count;i++){const option=document.createElement('option');option.value=String(i);option.textContent=`Chapter ${i}`;chapter.append(option);}if(category.value==='old_questions'&&grade.value==='12'){for(const label of ['Set 2024 · SQ',...['2024 Set 1','2024 Set 2','2024 Set 3','2024 Set 4','2024 Set 5','2024 Set 6','2024 Set 7'].map((x)=>`Set ${x.replace(' Set ',' · ')}`),...Array.from({length:12},(_,i)=>`Set 2025 · ${i+1}`),'Set 2026 · 1','Set 2026 · 2','Set 2026 · 3']){const option=document.createElement('option');option.value=label;option.textContent=label;chapter.append(option);}}}
function showEditor(row={}){document.getElementById('record-id').value=row.id||'';document.getElementById('edit-grade').value=row.grade||grade.value;document.getElementById('edit-category').value=row.category||category.value;document.getElementById('edit-chapter').value=row.chapter||chapter.value||'Chapter 1';document.getElementById('edit-title').value=row.title||'';document.getElementById('edit-order').value=row.sortOrder??0;document.getElementById('edit-active').value=String(row.active!==false);document.getElementById('edit-content').value=JSON.stringify(row.content??{},null,2);editor.hidden=false;editor.scrollIntoView({behavior:'smooth',block:'start'});}
function renderRows(rows){records.replaceChildren();document.getElementById('count').textContent=`${rows.length} records`;if(!rows.length){records.innerHTML='<div class="empty">No content found for this selection.</div>';return;}for(const row of rows){const card=document.createElement('article');card.className='record';const top=document.createElement('div');top.className='record-top';const info=document.createElement('div');const title=document.createElement('h3');title.textContent=row.title;const meta=document.createElement('p');meta.textContent=`Grade ${row.grade} · ${row.category.replaceAll('_',' ')} · ${row.chapter}${row.active===false?' · Hidden':''}`;info.append(title,meta);const actions=document.createElement('div');actions.className='record-actions';const edit=document.createElement('button');edit.type='button';edit.className='edit-btn';edit.textContent='Edit';edit.onclick=()=>showEditor(row);const remove=document.createElement('button');remove.type='button';remove.className='delete-btn';remove.textContent='Delete';remove.onclick=async()=>{if(!confirm(`Delete “${row.title}”?`))return;try{await AdminApi.deleteEducationalContent(row.id);await load();setMessage('Deleted.');}catch(error){setMessage(error.message,true);}};actions.append(edit,remove);top.append(info,actions);card.append(top);records.append(card);}}
async function load(){setMessage('Loading…');records.replaceChildren();try{const rows=await AdminApi.getEducationalContent({grade:grade.value,category:category.value,...(chapter.value?{chapter:chapter.value}:{})});renderRows(rows);setMessage('Loaded from database.');}catch(error){setMessage(error.message,true);}}
grade.onchange=()=>{rebuildChapters();load();};category.onchange=()=>{rebuildChapters();load();};chapter.onchange=load;document.getElementById('add').onclick=()=>showEditor();document.getElementById('cancel').onclick=()=>{editor.hidden=true;};editor.onsubmit=async(event)=>{event.preventDefault();try{const content=JSON.parse(document.getElementById('edit-content').value);await AdminApi.saveEducationalContent({id:document.getElementById('record-id').value||undefined,grade:Number(document.getElementById('edit-grade').value),category:document.getElementById('edit-category').value,chapter:document.getElementById('edit-chapter').value.trim(),title:document.getElementById('edit-title').value.trim(),sortOrder:Number(document.getElementById('edit-order').value||0),active:document.getElementById('edit-active').value==='true',content});editor.hidden=true;await load();setMessage('Saved to database.');}catch(error){setMessage(error.message||'Content JSON is not valid.',true);}};
rebuildChapters();load();
</script>
</body></html>
