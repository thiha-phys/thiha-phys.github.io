<!doctype html>
<html lang="my">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-cကိုolor" content="#f4f7fb">
    <link rel="manifest" href="manifest.webmanifest">
    <title>UTHK Admin</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="icons/app-icon-192.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <main class="app-shell">
        <header class="topbar">
            <a class="brand" href="./index.html"><img src="logo.png" alt=""><span><strong>UTHK</strong><small>ADMIN PANEL</small></span></a>
            <span class="topbar-note"><span class="admin-status-check"><svg class="admin-line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></span> စီမံခန့်ခွဲမှုစနစ်</span>
        </header>

        <section class="section-block" aria-labelledby="overview-title">
            <div class="section-heading">
                <div><h3 id="overview-title">Overview</h3><span id="dashboard-updated" class="muted small">Loading latest orders…</span></div>
            </div>
            <div class="stats-grid">
                <article class="stat-card"><span class="stat-icon blue"><svg class="admin-line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM15 3v5h4M9 12h7M9 16h7"/></svg></span><div><span>Total Orders</span><strong id="stat-orders">—</strong></div></article>
                <article class="stat-card"><span class="stat-icon green"><svg class="admin-line-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5c-.7-.7-1.8-1-3.2-1-1.6 0-2.8.8-2.8 2s1.2 1.8 2.8 2 2.8.8 2.8 2-1.2 2-2.8 2c-1.3 0-2.5-.4-3.2-1M12 5.5v13"/></svg></span><div><span>Amount Received</span><strong id="stat-received">—</strong></div></article>
                <a class="stat-card stat-card-link" href="pages/historyorder.html?mode=unpaid" aria-label="View customer orders with an outstanding balance"><span class="stat-icon orange"><svg class="admin-line-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><div><span>To Collect</span><strong id="stat-outstanding">—</strong></div></a>
                <a class="stat-card stat-card-link" href="pages/historyorder.html?mode=undelivered" aria-label="View undelivered customer orders"><span class="stat-icon purple"><svg class="admin-line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v10H3zM14 10h4l3 3v4h-7z"/><circle cx="7" cy="19" r="2"/><circle cx="17" cy="19" r="2"/></svg></span><div><span>Undelivered</span><strong id="stat-undelivered">—</strong></div></a>
            </div>
            <section class="section-block" aria-labelledby="store-overview-title">
                <div class="section-heading">
                    <div><h3 id="store-overview-title">Store Overview</h3><span id="store-overview-updated" class="muted small">Loading store orders…</span></div>
                </div>
                <div class="stats-grid">
                    <article class="stat-card"><span class="stat-icon blue"><svg class="admin-line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM15 3v5h4M9 12h7M9 16h7"/></svg></span><div><span>Total Orders</span><strong id="store-stat-orders">—</strong></div></article>
                    <article class="stat-card"><span class="stat-icon green"><svg class="admin-line-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5c-.7-.7-1.8-1-3.2-1-1.6 0-2.8.8-2.8 2s1.2 1.8 2.8 2 2.8.8 2.8 2-1.2 2-2.8 2c-1.3 0-2.5-.4-3.2-1M12 5.5v13"/></svg></span><div><span>Amount Received</span><strong id="store-stat-received">—</strong></div></article>
                    <a class="stat-card stat-card-link" href="pages/undelivered-shop-orders.html?mode=unpaid" aria-label="View unpaid store orders"><span class="stat-icon orange"><svg class="admin-line-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><div><span>To Collect</span><strong id="store-stat-outstanding">—</strong></div></a>
                    <a class="stat-card stat-card-link" href="pages/undelivered-shop-orders.html?mode=undelivered" aria-label="View undelivered store orders"><span class="stat-icon purple"><svg class="admin-line-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v10H3zM14 10h4l3 3v4h-7z"/><circle cx="7" cy="19" r="2"/><circle cx="17" cy="19" r="2"/></svg></span><div><span>Undelivered</span><strong id="store-stat-undelivered">—</strong></div></a>
                </div>
            </section>
            <article class="chart-card">
                <div class="section-heading"><div><h3>Orders in the Last 7 Days</h3><p class="muted small">Order Date</p></div></div>
                <div id="orders-chart" class="mini-chart" aria-label="Orders in the last 7 days"></div>
            </article>
        </section>

        <footer class="app-footer">UTHK Admin · Physics Learning Hub</footer>
    </main>
    <script src="pages/admin-api.js"></script>
    <script src="pages/home.js"></script>
    <script src="pages/admin-nav.js"></script>
</body>
</html>
