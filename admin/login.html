<!doctype html>
<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin sign in</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page-shell"><section class="panel" style="max-width:460px;margin:12vh auto"><h1>Admin ဝင်ရန်</h1><form id="admin-login"><label class="field">Email<input name="email" type="email" autocomplete="username" required></label><label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary-button" style="margin-top:18px" type="submit">ဝင်မည်</button><p id="login-status" role="status"></p></form></section></main>
<script>
const API='https://uthk-physics-api.vercel.app';
document.getElementById('admin-login').addEventListener('submit',async event=>{event.preventDefault();const form=new FormData(event.currentTarget),status=document.getElementById('login-status');status.textContent='စစ်ဆေးနေသည်…';try{const response=await fetch(`${API}/api/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.get('email'),password:form.get('password')})});const result=await response.json();if(!response.ok)throw new Error(result.message||'ဝင်မရပါ။');if(result.user.role!=='admin')throw new Error('ဤအကောင့်ကို admin အဖြစ် သတ်မှတ်ထားခြင်းမရှိပါ။');const check=await fetch(`${API}/api/admin/users`,{headers:{Authorization:`Bearer ${result.token}`}});if(!check.ok){const denial=await check.json().catch(()=>({}));throw new Error(denial.message||`Admin ခွင့်ပြုချက်ကို စစ်မရပါ။ (${check.status})`);}localStorage.setItem('physicsLearningHubSession',result.token);localStorage.setItem('physicsLearningHubAdmin',JSON.stringify(result.user));sessionStorage.removeItem('physicsLearningHubSession');sessionStorage.removeItem('physicsLearningHubAdmin');location.replace('./index.html');}catch(error){status.textContent=error.message;}});
</script></body></html>
