<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=customer/">
    <title>Physics Learning Hub</title>
</head>
<body>
    <p><a href="customer/">Open Customer app</a></p>
    <script>
        (async () => {
            if ('serviceWorker' in navigator) {
                try {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(registrations
                        .filter((registration) => new URL(registration.scope).pathname === '/')
                        .map((registration) => registration.unregister()));
                } catch (error) {
                    console.warn('Unable to remove the previous root service worker.', error);
                }
            }
            window.location.replace('customer/' + window.location.search + window.location.hash);
        })();
    </script>
</body>
</html>
