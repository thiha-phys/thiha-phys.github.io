<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Physics Learning Hub</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 28px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e8edf5;
            color: #4b5563;
            font-family: 'Pyidaungsu', Arial, sans-serif;
        }

        .auth-shell {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            width: 100%;
            max-width: 440px;
            padding: 5px;
            border-radius: 36px;
            background: transparent;
            box-shadow:
                0 0 18px rgba(57, 174, 255, 0.22),
                0 18px 48px rgba(67, 80, 112, 0.2);
        }

        .auth-shell::before {
            position: absolute;
            inset: -75%;
            z-index: -1;
            border-radius: inherit;
            background: conic-gradient(
                from 20deg,
                #ff365d,
                #ff9a24,
                #ffe43b,
                #4dde76,
                #17c8d8,
                #3478ff,
                #a849f5,
                #f52cbd,
                #ff365d
            );
            content: "";
            animation: spin-auth-colors 6s linear infinite;
        }

        @keyframes spin-auth-colors {
            to {
                transform: rotate(1turn);
            }
        }

        .auth-content {
            position: relative;
            z-index: 1;
            padding: 30px 26px 22px;
            border-radius: 32px;
            background: #e8edf5;
            box-shadow:
                inset 5px 5px 12px #cdd3dd,
                inset -5px -5px 12px #ffffff;
        }

        .brand {
            margin-bottom: 22px;
            text-align: center;
        }

        .brand-icon {
            width: 54px;
            height: 54px;
            margin: 0 auto 10px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #e8edf5;
            color: #5276d8;
            font-size: 22px;
            box-shadow:
                6px 6px 12px #cdd3dd,
                -6px -6px 12px #ffffff;
        }

        .brand-icon svg {
            width: 34px;
            height: 34px;
        }

        .brand h1 {
            margin: 0;
            color: #424b5b;
            font-size: 22px;
        }

        .brand p {
            margin: 5px 0 0;
            color: #9aa3b2;
            font-size: 12px;
        }

        .auth-form h2 {
            margin: 0 0 5px;
            color: #515b6d;
            font-size: 19px;
            text-align: center;
        }

        .form-intro {
            margin: 0 0 16px;
            color: #9aa3b2;
            font-size: 12px;
            text-align: center;
        }

        .field {
            display: block;
            margin-top: 12px;
            color: #8a93a2;
            font-size: 12px;
            font-weight: 700;
        }

        #signup-panel .field {
            margin-bottom: 34px;
        }

        .input-wrap {
            position: relative;
            display: block;
            width: 100%;
            margin-top: 6px;
        }

        .floating-field {
            margin-top: 18px;
        }

        .floating-label {
            position: absolute;
            top: 50%;
            left: 42px;
            z-index: 2;
            padding: 0 4px;
            background: #e8edf5;
            color: #8993a3;
            font-size: 13px;
            font-weight: 400;
            line-height: 1.2;
            pointer-events: none;
            transform: translateY(-50%);
            transition: top 0.18s ease, left 0.18s ease, font-size 0.18s ease, color 0.18s ease;
        }

        .floating-field:focus-within .floating-label,
        .floating-field input:not(:placeholder-shown) + .floating-label,
        .floating-field select:valid + .floating-label {
            top: -13px;
            left: 0;
            color: #8993a3;
            font-size: 13px;
        }

        .input-icon {
            position: absolute;
            top: 50%;
            left: 15px;
            z-index: 1;
            color: #a4adbb;
            font-size: 13px;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .field input,
        .field select {
            display: block;
            width: 100%;
            min-height: 46px;
            padding: 10px 42px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px;
            outline: none;
            background: #e8edf5;
            color: #596273;
            font: inherit;
            font-size: 13px;
            box-shadow:
                inset 5px 5px 9px #cdd3dd,
                inset -5px -5px 9px #ffffff;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .field input::placeholder {
            color: #8993a3;
        }

        .field input:focus,
        .field select:focus {
            border-color: rgba(83, 120, 220, 0.42);
            box-shadow:
                inset 3px 3px 6px #cdd3dd,
                inset -3px -3px 6px #ffffff,
                0 0 0 3px rgba(83, 120, 220, 0.1);
        }

        .field select {
            appearance: none;
            padding-right: 16px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 13px;
            padding: 5px;
            border: 0;
            background: transparent;
            color: #929cac;
            cursor: pointer;
            transform: translateY(-50%);
        }

        .field-hint {
            display: block;
            margin: 5px 0 0 12px;
            color: #9aa3b2;
            font-size: 10px;
            font-weight: 400;
        }

        .submit-button {
            width: 100%;
            min-height: 48px;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 24px;
            background: #e8edf5;
            color: #5276d8;
            font: inherit;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.04em;
            cursor: pointer;
            box-shadow:
                6px 6px 12px #cdd3dd,
                -6px -6px 12px #ffffff;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .submit-button:hover {
            color: #4268cf;
            box-shadow:
                3px 3px 7px #cdd3dd,
                -3px -3px 7px #ffffff;
        }

        .submit-button:active {
            transform: scale(0.99);
            box-shadow:
                inset 4px 4px 8px #cdd3dd,
                inset -4px -4px 8px #ffffff;
        }

        .auth-switch {
            margin: 18px 0 0;
            color: #9aa3b2;
            font-size: 11px;
            text-align: center;
        }

        .auth-switch button {
            padding: 0 0 0 3px;
            border: 0;
            background: transparent;
            color: #5276d8;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        .connection-note {
            min-height: 18px;
            margin: 12px 0 0;
            color: #64748b;
            font-size: 11px;
            line-height: 1.5;
            text-align: center;
        }

        [hidden] {
            display: none !important;
        }

        @media (prefers-reduced-motion: reduce) {
            .auth-shell::before {
                animation: none;
            }
        }

        @media (max-width: 380px) {
            body {
                padding: 18px 12px;
            }

            .auth-content {
                padding: 24px 18px 20px;
            }
        }

        @media (max-height: 760px) {
            body {
                align-items: flex-start;
            }
        }

        @media (min-width: 800px) {
            .auth-shell {
                max-width: 920px;
            }

            .auth-content {
                display: grid;
                grid-template-columns: minmax(0, 0.85fr) minmax(0, 1fr);
                align-items: center;
                column-gap: clamp(30px, 6vw, 72px);
                padding: 48px clamp(34px, 6vw, 72px);
            }

            .brand {
                grid-column: 1;
                grid-row: 1 / span 3;
                margin: 0;
                text-align: left;
            }

            .brand-icon {
                margin-left: 0;
            }

            .auth-form,
            .connection-note {
                grid-column: 2;
            }
        }
    </style>
</head>
<body>
    <main class="auth-shell">
      <div class="auth-content">
        <header class="brand">
            <div class="brand-icon" aria-hidden="true">
                <svg viewBox="0 0 48 48" fill="none">
                    <circle cx="24" cy="24" r="3.5" fill="#5276d8"/>
                    <ellipse cx="24" cy="24" rx="19" ry="7" stroke="#5276d8" stroke-width="2.5"/>
                    <ellipse cx="24" cy="24" rx="19" ry="7" transform="rotate(60 24 24)" stroke="#5276d8" stroke-width="2.5"/>
                    <ellipse cx="24" cy="24" rx="19" ry="7" transform="rotate(120 24 24)" stroke="#5276d8" stroke-width="2.5"/>
                </svg>
            </div>
            <h1>Physics Learning Hub</h1>
            <p>သင်ခန်းစာများကို ဆက်လက်လေ့လာရန် ဝင်ရောက်ပါ</p>
        </header>

        <section class="auth-form" id="login-panel" aria-labelledby="login-heading">
            <h2 id="login-heading">ပြန်လည်ဝင်ရောက်ရန်</h2>
            <p class="form-intro">ဖုန်းနံပါတ်နှင့် password ကိုမှန်ကန်စွာ ထည့်ပါ။</p>
            <form data-auth-form="login">
                <label class="field">
                    <span class="input-wrap floating-field">
                        <i class="input-icon fa-solid fa-phone" aria-hidden="true"></i>
                        <input name="phone" type="tel" autocomplete="tel" placeholder=" " required>
                        <span class="floating-label">ဖုန်းနံပါတ် (Phone)</span>
                    </span>
                </label>
                <label class="field">
                    <span class="input-wrap floating-field">
                        <i class="input-icon fa-solid fa-lock" aria-hidden="true"></i>
                        <input name="password" type="password" autocomplete="current-password" placeholder=" " required>
                        <span class="floating-label">Password</span>
                        <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
                    </span>
                </label>
                <button class="submit-button" type="submit">LOGIN ဝင်ရန်</button>
            </form>
            <p class="auth-switch">အကောင့်မရှိသေးဘူးလား? <button id="signup-tab" type="button" aria-controls="signup-panel">Create Account</button></p>
        </section>

        <section class="auth-form" id="signup-panel" aria-labelledby="signup-heading" hidden>
            <h2 id="signup-heading">Create Account</h2>
            <p class="form-intro">လိုအပ်တဲ့ အချက်အလက်တွေ ဖြည့်ပေးပါ။</p>
            <form data-auth-form="signup">
                <label class="field">
                    <span class="input-wrap floating-field">
                        <i class="input-icon fa-solid fa-user" aria-hidden="true"></i>
                        <input name="name" type="text" autocomplete="name" placeholder=" " required>
                        <span class="floating-label">အမည် (Name)</span>
                    </span>
                </label>
                <label class="field">
                    <span class="input-wrap floating-field">
                        <i class="input-icon fa-solid fa-briefcase" aria-hidden="true"></i>
                        <select name="job" required>
                            <option value="" selected disabled hidden></option>
                            <option value="Teacher">Teacher</option>
                            <option value="Student">Student</option>
                        </select>
                        <span class="floating-label">Select job</span>
                    </span>
                </label>
                <label class="field">
                    <span class="input-wrap floating-field">
                        <i class="input-icon fa-solid fa-envelope" aria-hidden="true"></i>
                        <input name="email" type="text" autocomplete="email" placeholder=" ">
                        <span class="floating-label">Email</span>
                    </span>
                </label>
                <label class="field">
                    <span class="input-wrap floating-field">
                        <i class="input-icon fa-solid fa-phone" aria-hidden="true"></i>
                        <input name="phone" type="tel" autocomplete="tel" placeholder=" " required>
                        <span class="floating-label">ဖုန်းနံပါတ် (Phone)</span>
                    </span>
                </label>
                <button class="submit-button" type="submit">REGISTER <i class="fa-solid fa-user-plus" aria-hidden="true"></i></button>
            </form>
            <p class="auth-switch">အကောင့်ရှိပြီးသားလား? <button id="login-tab" type="button" aria-controls="login-panel">Login ဝင်ရန်</button></p>
        </section>

        <p class="connection-note" id="connection-note" role="status" aria-live="polite"></p>
      </div>
    </main>

    <script src="profile-api.js"></script>
    <script>
        const loginTab = document.getElementById('login-tab');
        const signupTab = document.getElementById('signup-tab');
        const loginPanel = document.getElementById('login-panel');
        const signupPanel = document.getElementById('signup-panel');
        const connectionNote = document.getElementById('connection-note');

        if (new URLSearchParams(window.location.search).has('created')) {
            connectionNote.textContent = 'အကောင့်ဖွင့်ပြီးပါပြီ။ ဖုန်းနံပါတ်နဲ့ Password ကိုသုံးပြီး Login ဝင်ပါ။';
        }

        function showPanel(panelName) {
            const isLogin = panelName === 'login';
            loginPanel.hidden = !isLogin;
            signupPanel.hidden = isLogin;
            connectionNote.textContent = '';
        }

        loginTab.addEventListener('click', () => showPanel('login'));
        signupTab.addEventListener('click', () => showPanel('signup'));

        function formatPhoneNumber(value) {
            const digits = value.replace(/[၀-၉]/g, (digit) =>
                String(digit.charCodeAt(0) - '၀'.charCodeAt(0))
            ).replace(/\D/g, '');
            if (digits.length !== 11 || digits[0] !== '0') return digits;
            return `${digits.slice(0, 2)} ${digits.slice(2, 5)} ${digits.slice(5, 8)} ${digits.slice(8, 11)}`;
        }

        function normalizePhoneNumber(value) {
            return value.replace(/[၀-၉]/g, (digit) =>
                String(digit.charCodeAt(0) - '၀'.charCodeAt(0))
            ).replace(/\D/g, '');
        }

        document.querySelectorAll('.password-toggle').forEach((toggle) => {
            toggle.addEventListener('click', () => {
                const input = toggle.parentElement.querySelector('input');
                const icon = toggle.querySelector('i');
                const showingPassword = input.type === 'password';

                input.type = showingPassword ? 'text' : 'password';
                toggle.setAttribute('aria-pressed', String(showingPassword));
                toggle.setAttribute('aria-label', showingPassword ? 'Hide password' : 'Show password');
                icon.classList.toggle('fa-eye', !showingPassword);
                icon.classList.toggle('fa-eye-slash', showingPassword);
            });
        });

        document.querySelector('[data-auth-form="signup"]').addEventListener('submit', async (event) => {
            event.preventDefault();
            const form = event.currentTarget;
            const phone = form.elements.namedItem('phone').value;
            const normalizedPhone = normalizePhoneNumber(phone);
            if (!normalizedPhone) {
                connectionNote.textContent = 'ဖုန်းနံပါတ် ထည့်ပါ။';
                return;
            }

            const profile = {
                name: form.elements.namedItem('name').value.trim(),
                occupation: form.elements.namedItem('job').value,
                email: form.elements.namedItem('email').value.trim(),
                phone: formatPhoneNumber(normalizedPhone)
            };

            try {
                connectionNote.textContent = 'ဒီဖုန်းနံပါတ်နဲ့ အကောင့်ရှိမရှိ စစ်ဆေးနေပါတယ်...';
                try {
                    await findProfileByPhone(normalizedPhone);
                    connectionNote.textContent = 'ဒီဖုန်းနံပါတ်နဲ့ အကောင့်ရှိပြီးသားပါ။ အကောင့်အသစ် ထပ်ဖွင့်လို့မရပါ။ Login ဝင်ပါ။';
                    return;
                } catch (error) {
                    if (error.code !== 'PHONE_NOT_FOUND') {
                        throw error;
                    }
                }

                connectionNote.textContent = 'အချက်အလက်တွေကို သိမ်းနေပါတယ်...';
                await sendProfileToSheet('create', {
                    name: profile.name,
                    job: profile.occupation,
                    email: profile.email,
                    phone: profile.phone
                });
            } catch (error) {
                console.error('Unable to create the profile in Google Sheets.', error);
                connectionNote.textContent = error.code === 'PHONE_EXISTS'
                    ? 'ဒီဖုန်းနံပါတ်နဲ့ အကောင့်ရှိပြီးသားပါ။ Login ဝင်ပါ။'
                    : `Sheet ထဲသို့ အချက်အလက်ပို့မရပါ။ ${error.message}`;
                return;
            }

            window.location.href = 'login.html?created=1';
        });

        document.querySelector('[data-auth-form="login"]').addEventListener('submit', async (event) => {
            event.preventDefault();
            const form = event.currentTarget;
            const phone = normalizePhoneNumber(form.elements.namedItem('phone').value);
            const password = form.elements.namedItem('password').value;

            if (!phone) {
                connectionNote.textContent = 'ဖုန်းနံပါတ် ထည့်ပါ။';
                return;
            }

            if (password !== 'phys1') {
                connectionNote.textContent = 'Password မှားနေပါတယ်။';
                return;
            }

            connectionNote.textContent = 'Account ကို စစ်ဆေးနေပါတယ်...';
            try {
                const result = await findProfileByPhone(phone);
                const profile = {
                    name: result.profile.name,
                    occupation: result.profile.job,
                    email: result.profile.email,
                    phone: formatPhoneNumber(result.profile.phone)
                };
                localStorage.setItem('physicsLearningHubProfile', JSON.stringify(profile));
                window.location.href = '../index.html';
            } catch (error) {
                if (error.code === 'PHONE_NOT_FOUND') {
                    connectionNote.textContent = 'ဒီဖုန်းနံပါတ်ကို စာရင်းများထဲမှာ မတွေ့ပါ။ ဖုန်းနံပါတ်ကို စစ်ဆေးပါ။';
                    return;
                }

                console.error('Unable to verify the profile in Google Sheets.', error);
                connectionNote.textContent = /Action must.*create.*update/i.test(error.message)
                    ? 'Login server မှာ account ရှာဖွေစစ်ဆေးတဲ့လုပ်ဆောင်ချက် မပါသေးပါ။ လက်ရှိ Code.gs ကို Apps Script မှာ Deploy > Manage deployments မှတစ်ဆင့် version အသစ်တင်ပေးပါ။'
                    : `Login မလုပ်နိုင်ပါ။ ${error.message}`;
            }
        });
    </script>
</body>
</html>
