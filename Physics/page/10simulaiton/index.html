<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Physics Simulations</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #0d1c2e 0%, #111f2d 100%);
      color: #1f2937;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 40px;
    }

    .page-shell {
      width: min(86vw, 460px);
      min-height: calc(100vh - 18px);
      background: #f3f4f5;
      border-radius: 30px 30px 0 0;
      padding: 18px 18px 14px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.2);
      position: relative;
    }

    .page-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 52px;
      margin-bottom: 18px;
    }

    .back-btn {
      position: absolute;
      left: 0;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      color: #1f2937;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .page-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #1f2937;
      text-align: center;
    }

    .grade-banner {
      background: linear-gradient(180deg, #11273d 0%, #0e1d30 100%);
      color: #ffffff;
      border-radius: 16px;
      padding: 18px 20px 14px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .grade-banner h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .grade-banner h2 .grade-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 38px;
      height: 28px;
      padding: 0 12px;
      border-radius: 10px;
      background: rgba(147, 197, 253, 0.18);
      border: 1px solid rgba(191, 219, 254, 0.4);
      color: #e0f2fe;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.04em;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .grade-banner p {
      margin: 8px 0 0;
      font-size: 12px;
      line-height: 1.5;
      color: rgba(255,255,255,0.8);
    }

    .selection-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .selection-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      min-height: 74px;
      background: #f7f7f7;
      border-radius: 14px;
      padding: 10px 14px 10px 12px;
      text-decoration: none;
      color: #1f2937;
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.02);
    }

    .selection-card.active {
      background: linear-gradient(180deg, #dff6eb 0%, #d5efe7 100%);
      border-color: rgba(133, 208, 175, 0.8);
    }

    .selection-card .left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .selection-number {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: #dceeff;
      color: #1d4ed8;
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .selection-card.active .selection-number {
      background: #bfead5;
      color: #1b5a42;
    }

    .selection-content {
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .selection-label {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.25;
      color: #1f2937;
    }

    .selection-subtitle {
      font-size: 12px;
      color: #64748b;
      line-height: 1.4;
      margin-top: 2px;
    }

    .selection-arrow {
      font-size: 20px;
      color: #64748b;
      flex-shrink: 0;
    }


    @media (max-width: 480px) {
      body { padding-top: 20px; }
      .page-shell { width: min(88vw, 420px); }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <a href="../G10.html" class="back-btn" aria-label="Back">
        <i class="fa-solid fa-chevron-left"></i>
      </a>
      <h1 class="page-title">Simulation</h1>
    </header>

    <div class="grade-banner">
      <h2>Physics Simulation <span class="grade-num">10</span></h2>
      <p>Choose a simulation topic to explore the concept interactively.</p>
    </div>

    <section class="selection-panel" aria-label="Simulation list">
      <a href="Projectile/index.html" class="selection-card active">
        <div class="left">
          <div class="selection-number">1</div>
          <div class="selection-content">
            <span class="selection-label">Projectile Motion</span>
            <span class="selection-subtitle">Horizontal and vertical motion</span>
          </div>
        </div>
        <i class="fa-solid fa-arrow-right selection-arrow"></i>
      </a>

      <a href="#" class="selection-card">
        <div class="left">
          <div class="selection-number">2</div>
          <div class="selection-content">
            <span class="selection-label">Linear Motion</span>
            <span class="selection-subtitle">Coming soon</span>
          </div>
        </div>
        <i class="fa-solid fa-arrow-right selection-arrow"></i>
      </a>

      <a href="#" class="selection-card">
        <div class="left">
          <div class="selection-number">3</div>
          <div class="selection-content">
            <span class="selection-label">Newton's Laws</span>
            <span class="selection-subtitle">Coming soon</span>
          </div>
        </div>
        <i class="fa-solid fa-arrow-right selection-arrow"></i>
      </a>

      <a href="#" class="selection-card">
        <div class="left">
          <div class="selection-number">4</div>
          <div class="selection-content">
            <span class="selection-label">Energy &amp; Power</span>
            <span class="selection-subtitle">Coming soon</span>
          </div>
        </div>
        <i class="fa-solid fa-arrow-right selection-arrow"></i>
      </a>
    </section>
  </div>

</body>
</html>
