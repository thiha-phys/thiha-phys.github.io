<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Account - Physics Learning Hub</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pyidaungsu', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }

        .phone-container {
            width: 100%;
            max-width: 480px;
            background-color: #f8fafc;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            height: 850px;
            padding-bottom: 84px;
        }

        /* Scrollable Content Area */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            padding-bottom: 100px;
        }

        /* Profile Header Card */
        .profile-header-card {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-radius: 24px;
            padding: 24px;
            color: white;
            text-align: center;
            position: relative;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.3);
        }

        .avatar-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 16px auto;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ef4444; /* Matching your red accent */
        }

        .avatar-container .edit-avatar-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background-color: #ef4444;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border: 2px solid white;
            cursor: pointer;
        }

        .profile-header-card h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profile-header-card p {
            font-size: 13px;
            color: #94a3b8;
        }

        /* Section Title */
        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Info Details Card */
        .info-card {
            background: white;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
            border: 1px solid #f1f5f9;
        }

        .info-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background-color: #fee2e2;
            color: #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            margin-right: 14px;
        }

        .info-text {
            flex: 1;
        }

        .info-label {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 2px;
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
        }

        /* Edit Button Style */
        .btn-edit {
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .btn-edit:hover {
            background-color: #dc2626;
        }

        /* Floating Bottom Navigation (Matching your theme) */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 440px;
            background: rgba(19, 32, 49, 0.82);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 10px 16px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -2px 10px rgba(15, 23, 42, 0.18), 0 10px 24px rgba(15, 23, 42, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
        }

        .nav-item {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #cbd5e1;
            font-size: 11px;
            gap: 4px;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .nav-item i {
            font-size: 18px;
            color: #cbd5e1;
        }

        .nav-item.active {
            color: #ef4444;
        }

        .nav-item.active i {
            color: #ef4444;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        
        <!-- Main Content -->
        <div class="content-area">
            
            <!-- Profile Header -->
            <div class="profile-header-card">
                <div class="avatar-container">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="User Profile">
                    <div class="edit-avatar-btn">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                </div>
                <h2>U Thiha Kyaw</h2>
                <p>Physics Teacher & Developer</p>
            </div>

            <!-- Personal Information Section -->
            <div class="section-title">
                <span>ကိုယ်ရေးအချက်အလက်များ</span>
            </div>

            <div class="info-card">
                <div class="info-item">
                    <div class="info-icon">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="info-text">
                        <div class="info-label">အမည် (Name)</div>
                        <div class="info-value">U Thiha Kyaw</div>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <i class="fa-solid fa-briefcase"></i>
                    </div>
                    <div class="info-text">
                        <div class="info-label">အလုပ်အကိုင် (Job / Position)</div>
                        <div class="info-value">Physics Teacher</div>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <i class="fa-solid fa-phone"></i>
                    </div>
                    <div class="info-text">
                        <div class="info-label">ဖုန်းနံပါတ် (Phone)</div>
                        <div class="info-value">09 258 558 839</div>
                    </div>
                </div>

                <div class="info-item">
                    <div class="info-icon">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <div class="info-text">
                        <div class="info-label">အီးမေးလ် (Email)</div>
                        <div class="info-value">thihakyawphys73@gmail.com</div>
                    </div>
                </div>
            </div>

            <!-- Edit Button Tool -->
            <button class="btn-edit">
                <i class="fa-solid fa-pen-to-square"></i> အချက်အလက်များ ပြင်ဆင်ရန် (Edit Profile)
            </button>

        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <a href="../index.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="announcement.html" class="nav-item">
                <i class="fa-solid fa-message"></i>
                <span>Announcement</span>
            </a>
            <a href="knowledge.html" class="nav-item">
                <i class="fa-solid fa-book"></i>
                <span>Knowledge</span>
            </a>
            <a href="account.html" class="nav-item active">
                <i class="fa-solid fa-user"></i>
                <span>Account</span>
            </a>
        </div>

    </div>

</body>
</html>
