<!DOCTYPE html>
<html lang="my">
<head>
    <script src="/Physics/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 12 Physics Simulations</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 0;
            background: #ffffff;
            color: #1f2937;
            font-family: 'Pyidaungsu', Arial, sans-serif;
        }

        .page-shell {
            width: 100%;
            max-width: none;
            min-height: 100vh;
            padding: 18px 18px 28px;
            border-radius: 0;
            background: #ffffff;
            box-shadow: none;
        }

        .page-header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 52px;
            margin-bottom: 22px;
        }

        .back-btn {
            position: absolute;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            color: #1f2937;
            font-size: 18px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }

        .page-title {
            margin: 0;
            color: #1f2937;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
        }

        .grade-banner {
            margin-bottom: 20px;
            padding: 18px 20px 14px;
            border-radius: 16px;
            background: linear-gradient(180deg, #11273d 0%, #0e1d30 100%);
            color: #fff;
            text-align: left;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .grade-banner h2 {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0;
            font-size: 21px;
            font-weight: 700;
            line-height: 1.4;
        }

        .grade-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 38px;
            height: 28px;
            padding: 0 12px;
            border: 1px solid rgba(191, 219, 254, 0.4);
            border-radius: 10px;
            background: rgba(147, 197, 253, 0.18);
            color: #e0f2fe;
            font: 800 15px Arial, sans-serif;
        }

        .grade-banner p {
            margin: 8px 0 0;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            line-height: 1.6;
        }

        .selection-panel {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .selection-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            width: 100%;
            min-height: 74px;
            padding: 10px 14px 10px 12px;
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 14px;
            background: #f7f7f7;
            color: #1f2937;
            text-align: left;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.02);
        }

        a.selection-card {
            background: linear-gradient(180deg, #dff6eb 0%, #d5efe7 100%);
            border-color: rgba(133, 208, 175, 0.8);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        a.selection-card:hover,
        a.selection-card:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
        }

        .selection-card .left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .selection-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            flex: 0 0 38px;
            border-radius: 12px;
            background: #bfead5;
            color: #1b5a42;
            font-size: 17px;
            font-weight: 700;
        }

        .selection-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .selection-label {
            color: #1f2937;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.35;
        }

        .selection-subtitle {
            margin-top: 2px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
        }

        .selection-arrow {
            flex: 0 0 auto;
            color: #64748b;
            font-size: 18px;
        }

        .coming-soon {
            opacity: 0.76;
        }

        .coming-soon .selection-number {
            background: #dceeff;
            color: #1d4ed8;
        }

        .coming-soon .selection-arrow {
            font-size: 12px;
        }

        @media (max-width: 480px) {
            body {
                padding: 0;
            }

            .page-shell {
                min-height: 100vh;
                border-radius: 0;
            }

            .selection-panel {
                grid-template-columns: minmax(0, 1fr);
            }
        }
    </style>
    <link rel="stylesheet" href="../brand.css">
</head>
<body>
    <main class="page-shell">
        <header class="page-header">
            <a href="../G12.html" class="back-btn" aria-label="Grade 12 သို့ ပြန်သွားရန်">
                <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
            </a>
            <h1 class="page-title">Simulation</h1>
        </header>

        <section class="grade-banner" aria-labelledby="simulation-heading">
            <h2 id="simulation-heading">Physics Simulation <span class="grade-num">12</span></h2>
            <p>လေ့လာလိုသည့် simulation ကို ရွေးချယ်ပါ။</p>
        </section>

        <section class="selection-panel" aria-label="Grade 12 simulation များ">
            <a href="nuclear%20fission/index.html" class="selection-card">
                <span class="left">
                    <span class="selection-number">1</span>
                    <span class="selection-content">
                        <span class="selection-label">Nuclear Fission</span>
                        <span class="selection-subtitle">Fission နှင့် chain reaction ကို လေ့လာရန်</span>
                    </span>
                </span>
                <i class="fa-solid fa-arrow-right selection-arrow" aria-hidden="true"></i>
            </a>

            <div class="selection-card coming-soon" aria-disabled="true">
                <span class="left">
                    <span class="selection-number">2</span>
                    <span class="selection-content">
                        <span class="selection-label">Radioactive Decay</span>
                        <span class="selection-subtitle">မကြာမီ ထည့်သွင်းပါမည်</span>
                    </span>
                </span>
                <span class="selection-arrow">Coming soon</span>
            </div>

            <div class="selection-card coming-soon" aria-disabled="true">
                <span class="left">
                    <span class="selection-number">3</span>
                    <span class="selection-content">
                        <span class="selection-label">Nuclear Fusion</span>
                        <span class="selection-subtitle">မကြာမီ ထည့်သွင်းပါမည်</span>
                    </span>
                </span>
                <span class="selection-arrow">Coming soon</span>
            </div>

            <div class="selection-card coming-soon" aria-disabled="true">
                <span class="left">
                    <span class="selection-number">4</span>
                    <span class="selection-content">
                        <span class="selection-label">Atomic Structure</span>
                        <span class="selection-subtitle">မကြာမီ ထည့်သွင်းပါမည်</span>
                    </span>
                </span>
                <span class="selection-arrow">Coming soon</span>
            </div>
        </section>
    </main>
</body>
</html>
