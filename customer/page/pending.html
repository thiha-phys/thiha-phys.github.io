<!doctype html>
<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Approval | Physics Learning Hub</title><link rel="stylesheet" href="../style.css"><style>body{background:#f4f7fb;color:#172033;font-family:Arial,sans-serif}.pending{width:min(520px,calc(100% - 32px));margin:16vh auto;padding:28px;border-radius:22px;background:#fff;box-shadow:0 12px 36px #17203312;text-align:center}.pending h1{font-size:24px}.pending p{line-height:1.8;color:#56647b}.pending button{border:0;border-radius:12px;padding:12px 18px;background:#3264db;color:#fff;font-size:15px}</style></head>
<body><main class="pending"><h1 id="title">အတည်ပြုချက် စောင့်ဆိုင်းနေပါသည်</h1><p id="message">Admin က သင့်အကောင့်ကို စစ်ဆေးပြီး အတည်ပြုပေးသည်နှင့် app ကို အသုံးပြုနိုင်ပါမည်။ ဒီစာမျက်နှာကို ဖွင့်ထားပါက အလိုအလျောက် စစ်ဆေးပေးပါမည်။</p><button id="logout" type="button">ထွက်ရန်</button></main><script src="api-config.js"></script><script>
const title=document.getElementById('title'),message=document.getElementById('message');
async function check(){try{const result=await physicsApiFetch('auth/me');const status=result.user?.approvalStatus||'approved';if(status==='approved'){localStorage.setItem('physicsLearningHubProfile',JSON.stringify(result.user));location.replace('../index.html');return;}if(status==='rejected'){title.textContent='အကောင့်ကို အတည်မပြုနိုင်ပါ';message.textContent='Admin ထံ ဆက်သွယ်ပြီး အကောင့်အခြေအနေကို မေးမြန်းပါ။';}}catch(error){message.textContent='အတည်ပြုမှုကို စစ်ဆေးမရပါ။ အင်တာနက်ပြန်ရပါက ထပ်မံစစ်ဆေးပါမည်။';}}
document.getElementById('logout').addEventListener('click',async()=>{try{await physicsApiFetch('auth/logout',{method:'POST'});}catch{}localStorage.removeItem('physicsLearningHubSession');localStorage.removeItem('physicsLearningHubProfile');location.replace('login.html');});check();setInterval(check,15000);
</script></body></html>
