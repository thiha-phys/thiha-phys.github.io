<!doctype html>
<html lang="my">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7fb">
    <title>My Orders | Physics Learning Hub</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body{box-sizing:border-box;width:100%;padding:0;margin:0;background:#f4f7fb;color:#172033;font-family:Arial,sans-serif}
        main{box-sizing:border-box;width:100%;max-width:760px;padding-inline:16px;margin:12px auto 100px}
        header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
        header a{color:#345bd6;font-size:20px} h1{font-size:22px;margin:0}
        #orders{display:grid;gap:12px}
        .order-card{overflow:hidden;border:1px solid #80aaf2;border-radius:15px;background:#fff;box-shadow:0 9px 22px rgba(20,37,66,.20),0 2px 5px rgba(20,37,66,.12);transition:transform .18s ease,box-shadow .18s ease}
        .order-card:hover{transform:translateY(-2px);box-shadow:0 13px 27px rgba(20,37,66,.24),0 3px 7px rgba(20,37,66,.14)}
        .order-card-summary{display:grid;gap:9px;padding:16px 18px 13px;cursor:pointer;list-style:none}
        .order-card-summary::-webkit-details-marker{display:none}
        .order-card-summary:focus-visible{outline:3px solid rgba(57,120,232,.35);outline-offset:-3px}
        .order-card-heading,.order-card-statuses,.order-card-totals,.order-card-expand{display:flex;align-items:center}
        .order-card-heading{justify-content:space-between;gap:12px}
        .order-card-heading>strong{font-size:15px}
        .order-card-statuses{flex-wrap:wrap;justify-content:flex-end;gap:7px}
        .order-card-divider{height:1px;background:linear-gradient(90deg,#a9c7fb,#e2eaf8)}
        .order-card-info{color:#596780;font-size:12px}
        .order-customer{overflow-wrap:anywhere}
        .badge{display:inline-flex;align-items:center;white-space:nowrap;border-radius:20px;padding:4px 9px;background:#edf2fa;color:#63718a;font-size:11px}
        .badge.good{background:#e5f7ef;color:#18825e}
        .badge.warning{background:#fff3df;color:#b06b14}
        .badge.payment-method{background:#eaf1ff;color:#2f63bd}
        .muted{color:#68748a;font-size:13px}
        .order-card-totals{flex-wrap:wrap;gap:8px 20px;color:#596780;font-size:12px}.order-card-totals strong{color:#172033}
        .order-card-expand{justify-content:flex-end;gap:7px;color:#3978e8;font-size:11px;font-weight:700}
        .order-card-expand i{transition:transform .18s ease}
        .order-card[open] .order-card-expand i{transform:rotate(180deg)}
        .order-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;padding:16px 18px 18px;border-top:1px solid #e6edf8;background:linear-gradient(145deg,#f9fbff,#f2f6fd)}
        .order-details-section{border-top:1px solid #edf0f5;padding-top:12px}
        .order-details-section h4{margin:0 0 8px;color:#2d5fae;font-size:12px}
        .order-detail-line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #e5ebf4;font-size:11px}
        .order-detail-line span{flex:0 0 auto;color:#68748a}.order-detail-line strong{text-align:right;overflow-wrap:anywhere}
        .confirm-order-button{min-height:40px;margin:12px 18px 18px;padding:0 16px;border:0;border-radius:10px;background:#d72c2c;color:#fff;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
        .confirm-order-button:disabled{opacity:.55;cursor:wait}
        .notice{padding:18px;border-radius:14px;background:#fff;color:#58657a}
        @media(max-width:560px){
            main{width:calc(100% - 26px);padding:13px 0 125px;margin-top:0}
            #orders{padding-inline:16px}
            .order-card-summary{padding:14px 13px 12px}
            .order-card-heading{align-items:center;gap:6px}
            .order-card-heading>strong{font-size:14px}
            .order-card-statuses{justify-content:flex-start}
            .badge{padding-inline:7px}
            .order-details{grid-template-columns:1fr;gap:14px;padding:14px 13px}
            .order-card-totals{gap:5px 14px}
            .confirm-order-button{width:calc(100% - 28px)}
        }
    </style>
</head>
<body>
    <main>
        <header><a href="profile.html" aria-label="Profile သို့ပြန်သွားရန်"><i class="fa-solid fa-arrow-left"></i></a><h1>မှာယူမှုမှတ်တမ်း</h1></header>
        <section id="orders" aria-live="polite"><p class="notice">မှာယူမှုများကို ဖတ်နေသည်…</p></section>
    </main>
    <nav class="bottom-nav" aria-label="Main navigation">
        <a href="../index.html" class="nav-item"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Home</span></a>
        <a href="announcement.html" class="nav-item"><i class="fa-solid fa-message" aria-hidden="true"></i><span>Announcement</span></a>
        <a href="profile.html" class="nav-item active" aria-current="page"><i class="fa-solid fa-user" aria-hidden="true"></i><span>Profile</span></a>
    </nav>
    <script src="api-config.js"></script>
    <script>
        const host=document.getElementById('orders');
        const money=(amount)=>`${Number(amount||0).toLocaleString('my-MM')} ကျပ်`;
        const date=(value)=>{
            const text=String(value||'').trim();
            const isoDate=/^(\d{4})-(\d{2})-(\d{2})/.exec(text);
            if(isoDate)return `${isoDate[3]}/${isoDate[2]}/${isoDate[1]} ${text.length>10?text.slice(11,16):''}`.trim();
            const parsed=new Date(text);
            return Number.isNaN(parsed.getTime())?text||'—':new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}).format(parsed);
        };
        const escape=(value)=>String(value??'').replace(/[&<>"']/g,(character)=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[character]));
        function detailLine(label,value){
            return `<div class="order-detail-line"><span>${escape(label)}</span><strong>${escape(value||'—')}</strong></div>`;
        }
        function render(order){
            const card=document.createElement('details');
            card.className='order-card';
            const deliveryStatus=order.complete||['complete','received'].includes(order.status)
                ?'complete':['delivered','on_the_way'].includes(order.status)?'delivered':'pending';
            const deliveredDateLabel=order.deliveredDate?date(order.deliveredDate):deliveryStatus!=='pending'?'—':'မပို့ရသေး';
            const paymentComplete=Number(order.amountReceived||0)>=Number(order.total||0);
            const itemDetails=(order.items||[]).map(item =>
                detailLine(`${item.name} × ${item.quantity}`,money(item.amount))
            ).join('');
            card.innerHTML=`
                <summary class="order-card-summary">
                    <span class="order-card-heading">
                        <strong>${escape(order.voucherNo||'အော်ဒါ')}</strong>
                            <span class="order-card-statuses">
                                <span class="badge ${deliveryStatus==='pending'?'warning':'good'}">${deliveryStatus}</span>
                                <span class="badge ${paymentComplete?'good':'warning'}">${paymentComplete?'ငွေရှင်းပြီး':'ငွေမရှင်းရသေး'}</span>
                                <span class="badge payment-method">${/^k(pay|bz)/i.test(order.paymentMethod||'')?'KPay':escape(order.paymentMethod||'—')}</span>
                        </span>
                    </span>
                    <span class="order-card-divider"></span>
                    <span class="order-card-info">${escape(date(order.createdAt))}</span>
                    <span class="order-card-info order-customer">${escape(order.name||'')} · ${escape(order.phone||'')} · ${escape(order.address||order.city||'')}</span>
                    <span class="order-card-totals">
                        <span>စုစုပေါင်း <strong>${money(order.total)}</strong></span>
                        <span>ပေးချေပြီး <strong>${money(order.amountReceived)}</strong></span>
                    </span>
                    <span class="order-card-expand">အသေးစိတ်ကြည့်ရန် <i class="fa-solid fa-chevron-down"></i></span>
                </summary>
                <div class="order-details">
                    <section class="order-details-section">
                        <h4>စာအုပ်အသေးစိတ်</h4>${itemDetails||detailLine('စာအုပ်စာရင်း','မရှိပါ')}
                    </section>
                    <section class="order-details-section">
                        <h4>မှာယူမှုအသေးစိတ်</h4>
                        ${detailLine('မှာယူသူ',order.name)}
                        ${detailLine('ဖုန်းနံပါတ်',order.phone)}
                        ${detailLine('လိပ်စာ',`${order.city||''}${order.address?', '+order.address:''}`)}
                        ${detailLine('Ordered Date',date(order.createdAt))}
                        ${detailLine('Delivered Date',deliveredDateLabel)}
                        ${detailLine('ငွေပေးချေမှု',order.paymentMethod)}
                        ${detailLine('ပို့ဆောင်ရေး',order.deliveryService)}
                        ${detailLine('စုစုပေါင်း',money(order.total))}
                    </section>
                </div>`;
            if(deliveryStatus==='delivered'){
                const button=document.createElement('button');
                button.type='button';
                button.className='confirm-order-button';
                button.textContent='လက်ခံရရှိပြီလို့ အတည်ပြုမည်';
                button.addEventListener('click',async()=>{
                    button.disabled=true;
                    try{
                        await physicsApiFetch('orders/confirm',{method:'PATCH',body:JSON.stringify({voucherNo:order.voucherNo})});
                        order.status='complete';
                        order.complete=true;
                        card.replaceWith(render(order));
                    }catch(error){
                        button.disabled=false;
                        alert(error.message||'လက်ခံအတည်ပြု၍မရပါ။');
                    }
                });
                card.append(button);
            }
            return card;
        }
        (async()=>{
            if(!localStorage.getItem('physicsLearningHubSession')&&!sessionStorage.getItem('physicsLearningHubSession')){location.replace('login.html?returnTo='+encodeURIComponent('/page/order-history.html'));return;}
            try{const result=await physicsApiFetch('orders');host.replaceChildren();if(!result.orders?.length){const empty=document.createElement('p');empty.className='notice';empty.textContent='မှာယူမှုမှတ်တမ်း မရှိသေးပါ။';host.append(empty);return;}result.orders.forEach(order=>host.append(render(order)));}
            catch(error){const notice=document.createElement('p');notice.className='notice';notice.textContent=error.code==='AUTH_REQUIRED'?'အကောင့်ဝင်ထားမှု သက်တမ်းကုန်သွားပါပြီ။ ပြန်လည်ဝင်ပါ။':`မှာယူမှုမှတ်တမ်းကို ဖတ်မရပါ။ (${error.message||'ချိတ်ဆက်မှုအမှား'})`;host.replaceChildren(notice);}
        })();
    </script>
</body>
</html>
