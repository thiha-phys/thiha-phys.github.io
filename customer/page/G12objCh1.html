<!DOCTYPE html>
<html lang="my">
<head>
    <script src="/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>G12 Chapter 1 Objectives | Physics Learning Hub</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="chapter-content.css">
    <link rel="stylesheet" href="objective-quiz.css">
</head>
<body data-grade="G12" data-chapter="1">
    <div class="app-container">
        <header class="page-header">
            <a href="G12obj.html" class="back-btn" aria-label="အခန်းစာရင်းသို့ ပြန်သွားရန်">
                <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
            </a>
            <h1 class="page-title">Grade 12 Physics</h1>
            <div class="header-placeholder"></div>
        </header>
        <main class="chapter-content-page">
            <div class="chapter-content-heading">
                <a href="G12obj.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> အခန်းစာရင်း</a>
                <span class="chapter-content-label" id="chapter-content-label"></span>
                <h2 id="chapter-content-title"></h2>
            </div>
            <p class="objective-notice" id="objective-notice" role="status" hidden></p>
            <section class="objective-quiz-card" id="objective-quiz" aria-live="polite">
                <p class="objective-progress" id="objective-progress"></p>
                <p class="objective-section" id="objective-section"></p>
                <h3 class="objective-question" id="objective-question"></h3>
                <div class="objective-options" id="objective-options"></div>
                <p class="objective-result" id="objective-result" role="status" aria-live="polite"></p>
                <button class="primary-button objective-next" id="objective-next" type="button" hidden>နောက်မေးခွန်း</button>
            </section>
            <section class="objective-summary" id="objective-summary" hidden>
                <h3>လေ့ကျင့်မှုပြီးပါပြီ။</h3>
                <p data-objective-score></p>
                <button class="primary-button objective-retry" id="objective-retry" type="button">ပြန်လည်ဖြေဆိုရန်</button>
            </section>
        </main>
        <nav class="bottom-nav" aria-label="Main navigation">
            <a href="../index.html" class="nav-item"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Home</span></a>
            <a href="announcement.html" class="nav-item"><i class="fa-solid fa-message" aria-hidden="true"></i><span>Announcement</span></a>
            <a href="profile.html" class="nav-item"><i class="fa-solid fa-user" aria-hidden="true"></i><span>Profile</span></a>
        </nav>
    </div>
    <script src="objective-quiz-data.js"></script>
    <script src="objective-quiz.js"></script>
</body>
</html>
