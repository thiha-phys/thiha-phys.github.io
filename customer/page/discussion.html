<!DOCTYPE html>
<html lang="my">
<head>
    <script src="/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>ဆွေးနွေးရန် | Physics Learning Hub</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="discussion.css">
</head>
<body>
    <div class="discussion-app">
        <header class="discussion-page-header">
            <a href="../index.html" class="discussion-back" aria-label="Home">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            </a>
            <div class="discussion-heading">
                <h1>ဆွေးနွေးရန်</h1>
                <p>မေးမြန်းလိုတာကို Admin ထံ ပို့နိုင်ပါတယ်။</p>
            </div>
            <button class="discussion-refresh" id="discussion-refresh" type="button" aria-label="Refresh messages">
                <i class="fa-solid fa-rotate" aria-hidden="true"></i>
            </button>
        </header>

        <main class="discussion-main">
            <p class="discussion-private-note">
                <i class="fa-solid fa-lock" aria-hidden="true"></i>
                သင်နှင့် Admin သာ ဒီစကားဝိုင်းကို ကြည့်နိုင်ပါတယ်။
            </p>
            <section class="discussion-chat" aria-label="Discussion with Admin">
                <div class="discussion-messages" id="discussion-messages" aria-live="polite"></div>
                <p class="discussion-status" id="discussion-status" role="status" aria-live="polite"></p>
                <form class="discussion-composer" id="discussion-form">
                    <label class="discussion-input-wrap" for="discussion-input">
                        <textarea id="discussion-input" name="body" rows="1" maxlength="4000" placeholder="စာရေးပါ…" required></textarea>
                    </label>
                    <span class="discussion-character-count" id="discussion-character-count">0/4000</span>
                    <button class="discussion-send" id="discussion-send" type="submit" aria-label="Send message">
                        <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                    </button>
                </form>
            </section>
        </main>

        <nav class="bottom-nav" aria-label="Main navigation">
            <a href="../index.html" class="nav-item">
                <i class="fa-solid fa-house" aria-hidden="true"></i>
                <span>Home</span>
            </a>
            <a href="announcement.html" class="nav-item">
                <i class="fa-solid fa-message" aria-hidden="true"></i>
                <span>Announcement</span>
            </a>
            <a href="profile.html" class="nav-item">
                <i class="fa-solid fa-user" aria-hidden="true"></i>
                <span>Profile</span>
            </a>
        </nav>
    </div>
    <script src="api-config.js"></script>
    <script src="profile-api.js"></script>
    <script src="discussion.js"></script>
</body>
</html>
