<!DOCTYPE html>
<html lang="my">
<head>
    <script src="/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#eef5f9">
    <title>Discussion | Physics Learning Hub</title>
    <link rel="icon" type="image/png" href="../logo.png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="discussion.css">
</head>
<body class="discussion-page-body">
    <div class="discussion-app">
        <header class="discussion-page-header">
            <a href="../index.html" class="discussion-back" aria-label="Home">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            </a>
            <img class="discussion-logo" src="../logo.png" alt="Physics Learning Hub logo">
            <div class="discussion-heading">
                <h1>U Thiha Kyaw</h1>
                <p><i class="fa-solid fa-lock" aria-hidden="true"></i> သင်နှင့် Admin သာ ဒီ ဆွေးနွေးချက်ကို ကြည့်နိုင်ပါတယ်။</p>
            </div>
        </header>

        <main class="discussion-main">
            <p class="discussion-error" id="discussion-error" role="alert" hidden></p>
            <section class="discussion-chat" aria-label="Discussion with Admin">
                <div class="discussion-messages" id="discussion-messages" aria-live="polite"></div>
                <form class="discussion-composer" id="discussion-form">
                    <label class="discussion-input-wrap" for="discussion-input">
                        <textarea id="discussion-input" name="body" rows="1" maxlength="4000" placeholder="Write a message..." aria-label="Write a message" required></textarea>
                    </label>
                    <button class="discussion-send" id="discussion-send" type="submit" aria-label="Send message">
                        <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                    </button>
                </form>
            </section>
        </main>
    </div>
    <script src="api-config.js"></script>
    <script src="profile-api.js"></script>
    <script src="discussion.js"></script>
</body>
</html>
