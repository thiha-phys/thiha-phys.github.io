<!DOCTYPE html>
<html lang="my">
<head>
    <script src="/auth-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>G12 Physics - Chapter 11 Calculations</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .problem-list-container { padding: 10px 20px 80px; display: flex; flex-direction: column; gap: 16px; }
    .problem-card { background: #fff; border: 1px solid #f1f5f9; border-radius: 14px; box-shadow: 0 3px 10px rgba(0,0,0,.04); padding: 16px; }
    .problem-number { margin-bottom: 10px; }
    .problem-number span { background: #eff6ff; border-radius: 6px; color: #2563eb; font-size: 12px; font-weight: 700; padding: 4px 10px; }
    .problem-content { color: #1e293b; font-family: 'Pyidaungsu', Arial, sans-serif; font-size: 14px; line-height: 1.6; }
    .problem-question { margin-top: 0; }
    .problem-question strong { color: #2563eb; }
    .problem-content hr { border: 0; border-top: 1px dashed #e2e8f0; margin: 12px 0; }
    .problem-content summary { color: #059669; cursor: pointer; font-weight: 600; }
    .problem-answer { background: #f8fafc; border-radius: 8px; color: #1e293b; font-family: 'Pyidaungsu', Arial, sans-serif; font-size: 15px; line-height: 2; margin-top: 10px; overflow-wrap: anywhere; padding: 12px; }
    .problem-answer p { margin: 7px 0; }
    .calculation-table-wrap { margin: 8px 0; overflow-x: auto; }
    .calculation-table { border-collapse: collapse; font-family: 'Pyidaungsu', Arial, sans-serif; font-size: 15px; max-width: 100%; min-width: 0; width: max-content; }
    .calculation-table td { border-bottom: 1px solid #e2e8f0; padding: 6px 4px; vertical-align: middle; }
    .calculation-table tr:first-child td { background: #eff6ff; font-weight: 600; }
    .calculation-result { color: #dc2626; font-weight: 700; }
    @media (max-width: 600px) { .problem-list-container { padding-left: 12px; padding-right: 12px; } .problem-card { padding: 12px; } .problem-answer { padding: 8px; } }
  </style>
  <script>window.MathJax = { tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] } };</script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

      <h1 class="page-title">Chapter 11 Calculations</h1>
      <div class="header-placeholder"></div>
    </header>
    <div class="grade-banner">
      <h2>Chapter 11 - Electromagnetic induction, generation and distribution of electricity</h2>
      <p>ပုစ္ဆာတွက်နည်းနှင့် အဖြေများ (စုစုပေါင်း 15 ပုဒ်)</p>
    </div>
    <main class="problem-list-container"></main>
  </div>
